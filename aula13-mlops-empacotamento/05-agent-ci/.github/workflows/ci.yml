# Aula 13 — O pipeline do agente: verificar, testar, publicar.
#
#   seguranca ─┐
#              ├─► publicar   (só no push para a main, e só se os dois passarem)
#   testes ────┘
#
# ONDE ESTE ARQUIVO PRECISA ESTAR: o GitHub só executa workflows de
# `.github/workflows/` na RAIZ do repositório. Esta pasta funciona como está
# quando ela é a raiz de um repositório próprio. Dentro de um repositório
# maior, o arquivo vai para a raiz e o `working-directory` abaixo passa a
# apontar para a pasta do agente.
#
# SECRETS (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  usuário do Docker Hub
#   DOCKERHUB_TOKEN     token de acesso do Docker Hub (não a senha)
#   GROQ_API_KEY        chave do modelo, para o eval; sem ela, o eval é pulado
#
# As actions estão fixadas por tag de versão. Uma tag pode ser movida por
# quem controla o repositório da action; fixar pelo SHA do commit é a forma
# que não muda — o mesmo argumento da imagem base fixada até o patch.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 1
  # Verificação de segurança do Dockerfile, antes de construir qualquer coisa.
  seguranca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # hadolint: boas práticas do Dockerfile (versão fixada da base, pip,
      # instruções). Falha só em achado de severidade "error".
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # Trivy, em modo de configuração: procura má configuração de segurança
      # no Dockerfile. Vai apontar que o processo roda como root (o
      # Dockerfile não declara USER) — achado que a aula de segurança trata.
      # Aqui o relatório é informativo (exit-code 0); com exit-code 1, o
      # achado passa a barrar a publicação.
      - name: trivy (configuração)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ------------------------------------------------------------------ 2
  # Testes unitários em todo push; o eval, só quando há chave do modelo.
  testes:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: dependências
        run: pip install -r requirements-dev.txt

      # Ferramentas, extração do veredito e API, sem chamar o modelo.
      - name: testes unitários
        run: pytest -v

      # O agente de verdade contra o gabarito, com taxa mínima de acerto.
      # Custa tokens e não é determinístico: por isso é um passo separado,
      # e só roda quando o secret existe.
      - name: eval do agente
        if: env.GROQ_API_KEY != ''
        env:
          LLM_PROVEDOR: groq
        run: pytest -v -s -m eval

  # ------------------------------------------------------------------ 3
  # Publica a imagem no Docker Hub, só depois de verificar e testar.
  publicar:
    needs: [seguranca, testes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Duas tags: `latest` e o SHA do commit. A do SHA liga a imagem
      # publicada ao commit exato que a gerou — a linhagem da aula de MLOps.
      - name: construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-ci:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-ci:${{ github.sha }}
